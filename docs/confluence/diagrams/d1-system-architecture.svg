<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6B77"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A6B54"/>
    </marker>
  </defs>
  <rect width="1040" height="640" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1C2733">System architecture — repos, machinery, clusters, and who touches what</text>

  <!-- GitHub org container -->
  <rect x="20" y="52" width="310" height="250" rx="8" fill="#F6F8F9" stroke="#94A3AD" stroke-dasharray="4 3"/>
  <text x="34" y="76" font-size="12" font-weight="bold" fill="#5A6B77">GITHUB ORGANIZATION</text>

  <rect x="34" y="90" width="282" height="56" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="46" y="112" font-size="13" font-weight="bold" fill="#1C2733">App repos (one per service)</text>
  <text x="46" y="130" font-size="11.5" fill="#5A6B77">vendors: write · source + Dockerfile + CI only</text>

  <rect x="34" y="156" width="282" height="56" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="46" y="178" font-size="13" font-weight="bold" fill="#1C2733">GitOps repo</text>
  <text x="46" y="196" font-size="11.5" fill="#5A6B77">write-closed · chart, env values, ArgoCD + Kargo config</text>

  <rect x="34" y="222" width="282" height="56" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="46" y="244" font-size="13" font-weight="bold" fill="#1C2733">Infra repo (Terraform)</text>
  <text x="46" y="262" font-size="11.5" fill="#5A6B77">invisible to vendors · applied only by Atlantis</text>

  <!-- CI + ECR -->
  <rect x="390" y="70" width="180" height="56" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="402" y="92" font-size="13" font-weight="bold" fill="#1C2733">GitHub Actions</text>
  <text x="402" y="110" font-size="11.5" fill="#5A6B77">OIDC role: push 1 repo only</text>

  <rect x="630" y="70" width="170" height="56" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="642" y="92" font-size="13" font-weight="bold" fill="#1C2733">ECR</text>
  <text x="642" y="110" font-size="11.5" fill="#5A6B77">immutable tags · scan on push</text>

  <line x1="330" y1="118" x2="388" y2="98" stroke="#5A6B77" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="332" y="94" font-size="10.5" fill="#5A6B77">merge</text>
  <line x1="570" y1="98" x2="628" y2="98" stroke="#5A6B77" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="580" y="92" font-size="10.5" fill="#5A6B77">push :sha</text>

  <!-- Hub cluster -->
  <rect x="390" y="170" width="410" height="240" rx="8" fill="#F6F8F9" stroke="#94A3AD" stroke-dasharray="4 3"/>
  <text x="404" y="194" font-size="12" font-weight="bold" fill="#5A6B77">HUB CLUSTER — EKS swiftwad-staging</text>

  <rect x="404" y="206" width="180" height="52" rx="6" fill="#EAF4F0" stroke="#1A6B54"/>
  <text x="416" y="227" font-size="13" font-weight="bold" fill="#1A6B54">Kargo</text>
  <text x="416" y="244" font-size="11" fill="#5A6B77">polls ECR 30s · promotes via git</text>

  <rect x="606" y="206" width="180" height="52" rx="6" fill="#EAF4F0" stroke="#1A6B54"/>
  <text x="618" y="227" font-size="13" font-weight="bold" fill="#1A6B54">ArgoCD (+ Dex SSO)</text>
  <text x="618" y="244" font-size="11" fill="#5A6B77">syncs clusters from gitops repo</text>

  <rect x="404" y="272" width="180" height="52" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="416" y="293" font-size="13" font-weight="bold" fill="#1C2733">Atlantis</text>
  <text x="416" y="310" font-size="11" fill="#5A6B77">plan on PR · apply on comment</text>

  <rect x="606" y="272" width="180" height="52" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="618" y="293" font-size="13" font-weight="bold" fill="#1C2733">Platform controllers</text>
  <text x="618" y="310" font-size="11" fill="#5A6B77">ALB ctl · external-dns · ESO</text>

  <rect x="404" y="338" width="382" height="52" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="416" y="359" font-size="13" font-weight="bold" fill="#1C2733">Staging workloads</text>
  <text x="416" y="376" font-size="11" fill="#5A6B77">namespace per service · quotas · non-root · chart-enforced conformance</text>

  <!-- Dev cluster -->
  <rect x="860" y="170" width="160" height="240" rx="8" fill="#F6F8F9" stroke="#94A3AD" stroke-dasharray="4 3"/>
  <text x="874" y="194" font-size="12" font-weight="bold" fill="#5A6B77">SPOKE — EKS</text>
  <text x="874" y="210" font-size="12" font-weight="bold" fill="#5A6B77">swiftwad-dev</text>
  <rect x="874" y="224" width="132" height="52" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="886" y="245" font-size="13" font-weight="bold" fill="#1C2733">Dev workloads</text>
  <text x="886" y="262" font-size="11" fill="#5A6B77">auto-promoted</text>

  <!-- flows -->
  <path d="M 660 128 Q 560 170 500 204" fill="none" stroke="#1A6B54" stroke-width="1.6" marker-end="url(#arrg)"/>
  <text x="560" y="152" font-size="10.5" fill="#1A6B54">poll ≤30s</text>

  <path d="M 404 240 Q 362 240 322 202" fill="none" stroke="#1A6B54" stroke-width="1.6" marker-end="url(#arrg)"/>
  <text x="322" y="252" font-size="10.5" fill="#1A6B54">git commit</text>
  <text x="322" y="266" font-size="10.5" fill="#1A6B54">(sole writer)</text>

  <path d="M 330 166 C 460 130 620 150 688 204" fill="none" stroke="#5A6B77" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="420" y="146" font-size="10.5" fill="#5A6B77">watched by ArgoCD</text>

  <path d="M 786 232 L 858 240" fill="none" stroke="#5A6B77" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="796" y="222" font-size="10.5" fill="#5A6B77">sync</text>
  <path d="M 620 258 C 598 282 594 306 596 336" fill="none" stroke="#5A6B77" stroke-width="1.5" marker-end="url(#arr)"/>

  <path d="M 330 262 Q 370 276 402 290" fill="none" stroke="#5A6B77" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="336" y="288" font-size="10.5" fill="#5A6B77">PRs</text>

  <!-- users / exposure -->
  <rect x="20" y="470" width="1000" height="130" rx="8" fill="#F6F8F9" stroke="#94A3AD" stroke-dasharray="4 3"/>
  <text x="34" y="494" font-size="12" font-weight="bold" fill="#5A6B77">HUMAN ACCESS — SSO ONLY</text>

  <rect x="34" y="506" width="200" height="76" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="46" y="528" font-size="13" font-weight="bold" fill="#1C2733">Vendors + staff</text>
  <text x="46" y="546" font-size="11.5" fill="#5A6B77">GitHub identity · org MFA</text>
  <text x="46" y="562" font-size="11.5" fill="#5A6B77">teams → roles (RBAC)</text>

  <rect x="300" y="506" width="220" height="76" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="312" y="528" font-size="13" font-weight="bold" fill="#1C2733">ALB + WAF + ACM TLS</text>
  <text x="312" y="546" font-size="11.5" fill="#5A6B77">argocd.swiftwad.com</text>
  <text x="312" y="562" font-size="11.5" fill="#5A6B77">kargo.swiftwad.com</text>

  <rect x="586" y="506" width="200" height="76" rx="6" fill="#EAF4F0" stroke="#1A6B54"/>
  <text x="598" y="528" font-size="13" font-weight="bold" fill="#1A6B54">Dex (in ArgoCD)</text>
  <text x="598" y="546" font-size="11.5" fill="#5A6B77">org gate: non-members refused</text>
  <text x="598" y="562" font-size="11.5" fill="#5A6B77">Kargo = PKCE static client</text>

  <rect x="846" y="506" width="160" height="76" rx="6" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="858" y="528" font-size="13" font-weight="bold" fill="#1C2733">external-dns</text>
  <text x="858" y="546" font-size="11.5" fill="#5A6B77">→ Cloudflare zone</text>
  <text x="858" y="562" font-size="11.5" fill="#5A6B77">(live public DNS)</text>

  <line x1="234" y1="544" x2="298" y2="544" stroke="#5A6B77" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="544" x2="584" y2="544" stroke="#5A6B77" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="786" y1="544" x2="844" y2="544" stroke="#5A6B77" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
