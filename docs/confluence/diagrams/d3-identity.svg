<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6B77"/>
    </marker>
    <marker id="a3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A6B54"/>
    </marker>
  </defs>
  <rect width="1040" height="470" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1C2733">Identity and authorization — one org gate, teams become roles in both UIs</text>

  <rect x="20" y="60" width="230" height="120" rx="8" fill="#F6F8F9" stroke="#94A3AD"/>
  <text x="34" y="84" font-size="12" font-weight="bold" fill="#5A6B77">GITHUB ORG (swiftwad)</text>
  <text x="34" y="106" font-size="12" fill="#1C2733">• org-owned OAuth app</text>
  <text x="34" y="126" font-size="12" fill="#1C2733">• MFA policy applies to all</text>
  <text x="34" y="146" font-size="12" fill="#1C2733">• teams: engineering,</text>
  <text x="48" y="164" font-size="12" fill="#1C2733">vendor-acme, …</text>

  <rect x="330" y="60" width="250" height="120" rx="8" fill="#EAF4F0" stroke="#1A6B54"/>
  <text x="344" y="84" font-size="12" font-weight="bold" fill="#1A6B54">DEX (embedded in ArgoCD)</text>
  <text x="344" y="106" font-size="12" fill="#1C2733">orgs filter → non-members</text>
  <text x="344" y="124" font-size="12" fill="#1C2733">refused server-side</text>
  <text x="344" y="146" font-size="12" fill="#1C2733">groups claim = "org:team-slug"</text>
  <text x="344" y="164" font-size="12" fill="#5A6B77">creds: Secrets Manager → ESO</text>

  <rect x="660" y="42" width="360" height="76" rx="8" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="674" y="64" font-size="12.5" font-weight="bold" fill="#1C2733">ArgoCD — policy.csv (Casbin)</text>
  <text x="674" y="84" font-size="11" fill="#5A6B77">p, role, resource, action, project/app-pattern, allow</text>
  <text x="674" y="102" font-size="11" fill="#5A6B77">g, org:team, role  ·  policy.default: "" (deny unmapped)</text>

  <rect x="660" y="132" width="360" height="94" rx="8" fill="#FFFFFF" stroke="#1C2733"/>
  <text x="674" y="154" font-size="12.5" font-weight="bold" fill="#1C2733">Kargo — claim-mapped ServiceAccounts</text>
  <text x="674" y="174" font-size="11" fill="#5A6B77">project layer: SAs in project ns + RoleBindings</text>
  <text x="674" y="192" font-size="11" fill="#5A6B77">global layer: SAs in kargo-global (list projects, admin)</text>
  <text x="674" y="210" font-size="11" fill="#5A6B77">user acts with UNION of matched SAs' k8s RBAC</text>

  <line x1="250" y1="120" x2="328" y2="120" stroke="#5A6B77" stroke-width="1.6" marker-end="url(#a3)"/>
  <text x="258" y="112" font-size="10.5" fill="#5A6B77">OAuth</text>
  <line x1="580" y1="96" x2="658" y2="80" stroke="#1A6B54" stroke-width="1.6" marker-end="url(#a3g)"/>
  <line x1="580" y1="140" x2="658" y2="170" stroke="#1A6B54" stroke-width="1.6" marker-end="url(#a3g)"/>
  <text x="590" y="126" font-size="10.5" fill="#1A6B54">id + groups</text>
  <text x="566" y="194" font-size="10.5" fill="#1A6B54">OIDC (PKCE)</text>

  <!-- delegation matrix -->
  <text x="20" y="266" font-size="13.5" font-weight="bold" fill="#1C2733">Delegation matrix (as deployed)</text>
  <g font-size="11.5">
    <rect x="20" y="278" width="1000" height="30" fill="#F6F8F9" stroke="#94A3AD"/>
    <text x="32" y="298" font-weight="bold" fill="#5A6B77">TEAM</text>
    <text x="220" y="298" font-weight="bold" fill="#5A6B77">ARGOCD</text>
    <text x="560" y="298" font-weight="bold" fill="#5A6B77">KARGO</text>

    <rect x="20" y="308" width="1000" height="34" fill="#FFFFFF" stroke="#E3E8EC"/>
    <text x="32" y="330" fill="#1C2733">swiftwad:vendor-acme</text>
    <text x="220" y="330" fill="#1C2733">read + logs on vendor-acme/* only; all mutations 403</text>
    <text x="560" y="330" fill="#1C2733">viewer in project; list-projects globally; cannot promote</text>

    <rect x="20" y="342" width="1000" height="34" fill="#F6F8F9" stroke="#E3E8EC"/>
    <text x="32" y="364" fill="#1C2733">swiftwad:engineering</text>
    <text x="220" y="364" fill="#1C2733">full application control within vendor projects</text>
    <text x="560" y="364" fill="#1C2733">project admin + promote verb on stages (identity recorded)</text>

    <rect x="20" y="376" width="1000" height="34" fill="#FFFFFF" stroke="#E3E8EC"/>
    <text x="32" y="398" fill="#1C2733">(future) prod-approvers</text>
    <text x="220" y="398" fill="#1C2733">same as engineering</text>
    <text x="560" y="398" fill="#1C2733">promote restricted by resourceNames: ["prod"]</text>

    <rect x="20" y="410" width="1000" height="34" fill="#F6F8F9" stroke="#E3E8EC"/>
    <text x="32" y="432" fill="#1C2733">unmapped GitHub user</text>
    <text x="220" y="432" fill="#1C2733">nothing — empty app list, every call denied</text>
    <text x="560" y="432" fill="#1C2733">nothing — no SA matches, no permissions resolve</text>
  </g>
</svg>
